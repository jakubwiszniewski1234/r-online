<!doctype html>
<html>
<body>
  <h1>Włączone dokumenty:</h1>
  <div id="output"></div>

  <script>
    let lastData = null

    function fetchData() {
      fetch("/api/docs")
        .then(res => res.json())
        .then(data => {
          const docs = data.docs
          let text = ""

          docs.forEach(doc => {
            text += doc
          })

          if (text !== lastData) {
            document.getElementById("output").innerText = text
            lastData = text
          }
        })
        .catch(err => console.error(err))
    }

    fetchData()

    setInterval(fetchData, 3000)
  </script>
</body>
</html>
