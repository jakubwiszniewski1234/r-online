<!doctype html>
<html>
<body>
  <h1>Dane z serwera:</h1>
  <div id="output"></div>

  <script>
    let lastData = null

    function fetchData() {
      fetch("/api/docs")
        .then(res => res.json())
        .then(data => {
          const docs = data.docs
          let text = ""

          docs.forEach(doc => {
            text += doc
          })

          // sprawdzanie czy dane się zmieniły
          if (text !== lastData) {
            console.log("Dane się zmieniły");
            document.getElementById("output").innerText = text
            lastData = text
          } else {
            console.log("Brak zmian")
          }
        })
        .catch(err => console.error(err))
    }

    // pierwsze wywołanie od razu
    fetchData()

    // potem co 3 sekundy
    setInterval(fetchData, 3000)
  </script>
</body>
</html>
